# Server Port
server.port=8080

# Application Name
spring.application.name=Smart Parking Management System

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:parkingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Enable H2 Console for debugging if needed
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf Cache (disable for development auto-reload)
spring.thymeleaf.cache=false
